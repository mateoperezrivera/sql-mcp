[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sql-mcp"
version = "0.1.0"
description = "MCP server for SQL operations"
requires-python = ">=3.10"
dependencies = [
    "mcp>=0.5.0",
    "pyodbc>=5.0.0",
    "azure-identity>=1.14.0",
    "uvicorn>=0.24.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
